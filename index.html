<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>커미션 보관함</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: patisserie-menu look — cream paper, cherry-red ink, oval title badge, sparkles; top nav, one centered column */
:root{
  --paper:#FBF3EC; --paper2:#F5E6DD; --card:#FFFBF8; --ink:#3B1F23; --cherry:#A3283A; --cherry-deep:#7E1B2B;
  --rose:#F6D9DB; --pink:#EFB3BD; --muted:#8C6A6E; --line:#EBD3CE;
  --ok:#4E7D4A; --ok-soft:#E3EEDC; --warn:#A8651C; --warn-soft:#F8E6CC;
  --f-display:"DM Serif Display","Gowun Batang",Georgia,serif;
  --f-serif:"Gowun Batang","Nanum Myeongjo",Georgia,serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.75;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .35  0 0 0 0 .3  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}
img{max-width:100%}
[hidden]{display:none!important}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cherry);outline-offset:2px;border-radius:4px}

/* header */
.hdr{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.hdr-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.logo{font-family:var(--f-display);color:var(--cherry);font-size:18px;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.nav{display:flex;gap:4px;flex:1;justify-content:center;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{font-family:var(--f-serif);font-weight:700;font-size:13.5px;letter-spacing:.04em;color:var(--cherry);text-decoration:none;padding:5px 12px;border-radius:999px;white-space:nowrap}
.nav a:hover{background:var(--rose)}
.nav a.on{background:var(--cherry);color:var(--card)}
.hdr-r{display:flex;gap:6px;align-items:center}
@media (max-width:760px){.hdr-in{flex-wrap:wrap;gap:6px 10px}.nav{order:3;flex-basis:100%;justify-content:flex-start}.logo{max-width:60vw}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--cherry);background:transparent;color:var(--cherry);border-radius:999px;padding:6px 16px;font-family:var(--f-serif);font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap;text-decoration:none;line-height:1.3}
.btn:hover{background:var(--rose)}
.btn.primary{background:var(--cherry);color:var(--card)}
.btn.primary:hover{background:var(--cherry-deep)}
.btn.ghost{border-color:transparent}
.btn.danger{border-color:var(--cherry-deep);color:var(--cherry-deep)}
.btn.sm{padding:3px 11px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:default}
.edit-strip{text-align:center;padding:6px 16px;background:var(--rose);color:var(--cherry-deep);font-size:13px}

/* page */
.page{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:36px 80px}
.narrow{max-width:760px;margin-inline:auto}
.sec-title{display:flex;align-items:center;justify-content:center;gap:14px;font-family:var(--f-display);color:var(--cherry);font-size:clamp(24px,3.6vw,32px);font-weight:400;margin:56px 0 22px;text-align:center;line-height:1.25;text-wrap:balance}
.sec-title .spk{width:14px;height:14px;flex:none;fill:var(--cherry)}
.sec-sub{display:block;text-align:center;color:var(--muted);font-size:13.5px;margin:-14px 0 20px}
.pg-title{font-family:var(--f-display);color:var(--cherry);font-weight:400;font-size:clamp(32px,5vw,46px);line-height:1.15;margin:0 0 6px;text-align:center;text-wrap:balance}
.pg-sub{text-align:center;color:var(--muted);margin:0 0 26px}
.muted{color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted)}

/* hero */
.hero{position:relative;text-align:center;padding:30px 0 10px}
.oval{position:relative;display:inline-block;padding:22px 56px;margin:0 auto;max-width:100%}
.oval svg.ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.oval svg.ring ellipse{fill:none;stroke:var(--cherry)}
.oval h1{position:relative;margin:0;font-family:var(--f-display);font-weight:400;color:var(--cherry);font-size:clamp(34px,7vw,64px);line-height:1.1;letter-spacing:.01em;text-shadow:2px 2px 0 var(--pink);overflow-wrap:anywhere}
.hero .intro{max-width:46ch;margin:22px auto 0;color:var(--cherry);font-family:var(--f-serif);font-size:14.5px;line-height:1.9;letter-spacing:.02em}
.spark{position:absolute;fill:var(--cherry);opacity:.85}
.hero-cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:34px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;align-items:center;gap:0;padding:16px 10px;border:1px solid var(--line);border-radius:18px;background:var(--card);text-decoration:none;text-align:center}
a.tile:hover{border-color:var(--cherry)}
.tile .k{font-size:12.5px;color:var(--muted)}
.tile .v{font-family:var(--f-display);color:var(--cherry);font-size:30px;line-height:1.2;font-variant-numeric:tabular-nums}
.tile .v small{font-family:var(--f-body);font-size:13px;color:var(--muted);margin-left:2px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px 16px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}}
.card{display:flex;flex-direction:column;align-items:center;text-decoration:none;min-width:0;text-align:center}
.frame{width:100%;aspect-ratio:3/4;border-radius:999px 999px 18px 18px;overflow:hidden;position:relative;background:var(--c,var(--rose));border:1.5px solid var(--cherry);box-shadow:4px 4px 0 var(--pink);display:grid;place-items:center}
.card:hover .frame{transform:translateY(-2px)}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame .ini{font-family:var(--f-display);color:#fff;font-size:56px;text-shadow:2px 2px 0 rgba(0,0,0,.12)}
.card .nm{margin-top:12px;font-family:var(--f-serif);font-weight:700;color:var(--cherry);font-size:15.5px;line-height:1.35;overflow-wrap:anywhere}
.card .sb{font-size:12.5px;color:var(--muted);line-height:1.45}
.wcard .frame{aspect-ratio:1;border-radius:18px;background:var(--paper2)}
.wcard .frame .none{font-size:12.5px;color:var(--muted)}
.wcard .badge{position:absolute;left:8px;top:8px}
.card-wrap{display:flex;flex-direction:column;gap:8px;align-items:center;min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:4px}
.tag{font-size:11.5px;padding:0 9px;border-radius:999px;background:var(--rose);color:var(--cherry-deep);line-height:1.8;text-decoration:none}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:0 9px;border-radius:999px;white-space:nowrap;line-height:1.8;font-family:var(--f-body)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.s0{background:var(--card);color:var(--muted);border:1px solid var(--line)}
.chip.s1{background:var(--warn-soft);color:var(--warn)}
.chip.s2{background:var(--rose);color:var(--cherry)}
.chip.s3{background:var(--ok-soft);color:var(--ok)}

/* character detail */
.char-top{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:36px;align-items:start}
@media (max-width:720px){.char-top{grid-template-columns:minmax(0,1fr)}.char-top .frame{max-width:280px;margin:0 auto}}
.char-top .frame .ini{font-size:90px}
.char-top .pg-title,.char-top .pg-sub{text-align:left}
@media (max-width:720px){.char-top .pg-title,.char-top .pg-sub{text-align:center}}
.props{display:grid;grid-template-columns:minmax(80px,130px) minmax(0,1fr);border-top:1.5px solid var(--cherry);margin-top:16px}
.props>div{padding:8px 4px;border-bottom:1px dashed var(--line);font-size:14.5px;min-width:0;overflow-wrap:anywhere}
.props .pk{color:var(--cherry);font-family:var(--f-serif);font-weight:700;font-size:13px}
.props a{color:var(--cherry)}
.note{padding:16px 18px;border-radius:16px;background:var(--card);border:1px solid var(--line);overflow-wrap:anywhere}
.note.warn{background:var(--warn-soft);border-color:transparent}
.note .lbl{display:block;font-family:var(--f-serif);font-weight:700;color:var(--cherry);margin-bottom:4px}
.note a{color:var(--cherry)}
.stack{display:flex;flex-direction:column;gap:12px}
.center{text-align:center}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gal figure{margin:0;position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.gal img{display:block;width:100%;aspect-ratio:1;object-fit:cover;cursor:zoom-in}
.gal.big{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.gal.big img{aspect-ratio:auto;max-height:560px;object-fit:contain;background:var(--paper2)}
.gal .x{position:absolute;top:8px;right:8px;background:var(--card)}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(40,16,20,.88);display:grid;place-items:center;padding:24px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}

/* table */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:0 0 20px}
.sel,.toolbar .in{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13.5px;width:auto;min-width:0}
.seg{display:inline-flex;border:1.5px solid var(--cherry);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--cherry);padding:4px 13px;font-size:13px;cursor:pointer;font-family:var(--f-serif);font-weight:700}
.seg button.on{background:var(--cherry);color:var(--card)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--f-serif);font-weight:700;text-align:left;color:var(--cherry);font-size:12.5px;padding:10px 12px;border-bottom:1.5px solid var(--cherry);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px dashed var(--line);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.rowlink{cursor:pointer}
tr.rowlink:hover td{background:color-mix(in srgb,var(--rose) 45%,transparent)}
td.mono{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
td .thumb{width:42px;height:42px;border-radius:10px;object-fit:cover;display:block;background:var(--paper2)}
td a{color:var(--cherry);text-decoration:none;font-weight:700}
td .sel{padding:2px 8px;font-size:12.5px}
.more{display:flex;justify-content:center;margin-top:16px}
.loading,.empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty{border:1.5px dashed var(--line);border-radius:18px}

/* artists */
.alist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.acard{display:flex;flex-direction:column;gap:2px;padding:16px 18px;border:1px solid var(--line);border-radius:18px;background:var(--card);text-decoration:none;min-width:0}
.acard:hover{border-color:var(--cherry)}
.acard b{font-family:var(--f-serif);color:var(--cherry);font-size:16px}
.acard span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}

/* forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 18px;padding:24px;border:1.5px solid var(--cherry);border-radius:22px;background:var(--card);box-shadow:5px 5px 0 var(--pink)}
@media (max-width:640px){.form{grid-template-columns:minmax(0,1fr);padding:18px}}
.form .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label,.lbl{font-family:var(--f-serif);font-weight:700;color:var(--cherry);font-size:13.5px}
.req{color:var(--cherry-deep);margin-left:2px}
.in,.ed{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 12px;font-size:15px;min-width:0}
textarea.in,textarea.ed{resize:vertical;line-height:1.65}
.in:focus,.ed:focus{outline:none;border-color:var(--cherry);box-shadow:0 0 0 3px var(--rose)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.ck{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 9px;font-size:13.5px;cursor:pointer;background:var(--paper)}
.ck input{accent-color:var(--cherry);margin:0}
.ck:has(input:checked){border-color:var(--cherry);background:var(--rose);color:var(--cherry-deep)}
.artist-how{grid-column:1/-1;font-size:13.5px;padding:12px 14px;border-radius:12px;background:var(--rose);color:var(--cherry-deep);white-space:pre-wrap;overflow-wrap:anywhere}
.out{margin-top:20px;border:1.5px solid var(--cherry);border-radius:22px;background:var(--card);overflow:hidden}
.out-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--rose);color:var(--cherry-deep);font-family:var(--f-serif);font-weight:700;font-size:14px}
.out textarea{display:block;width:100%;border:0;background:transparent;padding:18px;font-family:var(--f-mono);font-size:13px;line-height:1.75;resize:vertical;min-height:320px}
.out textarea:focus{outline:none}
.send-to,.added{padding:12px 18px;border-top:1px dashed var(--line);font-size:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.send-to code{font-family:var(--f-mono);background:var(--paper2);padding:2px 9px;border-radius:6px;user-select:all;overflow-wrap:anywhere}
.added{background:var(--ok-soft);color:var(--ok)}
.added a{color:inherit;font-weight:700}
.ed-row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.ed-row>*{flex:1 1 170px}
.ed-row>.fix,.ed-row>.btn{flex:0 0 auto}
.ed-box{border:1.5px dashed var(--pink);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--card)}
.h1-in{font-family:var(--f-display);color:var(--cherry);font-size:28px;padding:4px 12px}
.imgbtn{position:relative;overflow:hidden}
.imgbtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.steps{display:flex;flex-direction:column;gap:14px}
.step{display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 14px;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.step .n{font-family:var(--f-display);color:var(--cherry);font-size:34px;line-height:1;text-align:center}
.step b{font-family:var(--f-serif);color:var(--cherry);font-size:16.5px}
.foot{margin-top:70px;padding:24px 16px calc(28px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);text-align:center;font-size:12.5px;color:var(--muted)}
.foot .fname{font-family:var(--f-display);color:var(--cherry);font-size:18px;display:block;margin-bottom:6px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12.5px;padding:2px 4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--cherry-deep);color:var(--card);padding:10px 18px;border-radius:999px;font-size:14px;z-index:80;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(80,20,30,.25)}
.setup{max-width:620px;margin:10vh auto 0;padding-inline:16px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.card .frame{transition:transform .15s ease}
</style>
</head>

<script type="module">
/* =====================================================================
   1) 아래 FIREBASE_CONFIG 를 Firebase 콘솔에서 복사한 값으로 바꿔요.
   2) OWNER_EMAIL 은 편집할 구글 계정 주소예요.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA4lU_G0VWEu4dqQboqv-Y0DbSl5gLud1Y",
  authDomain: "commission-box-510ce.firebaseapp.com",
  projectId: "commission-box-510ce",
  storageBucket: "commission-box-510ce.firebasestorage.app",
  messagingSenderId: "176918333352",
  appId: "1:176918333352:web:323a3cac3c9f8709ad3f9d"
};
const OWNER_EMAIL = "guwon632@gmail.com";
/* ===================================================================== */

const V="10.12.2";
const STATUS=["신청","입금 완료","작업 중","완료"];
const PAGE=60;
const $=(s,r)=>(r||document).querySelector(s);
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function paras(s){s=String(s||"").trim();if(!s)return "";return s.split(/\n{2,}/).map(p=>"<p>"+esc(p).replace(/\n/g,"<br>")+"</p>").join("")}
function br(s){return esc(s).replace(/\n/g,"<br>")}

function won(n){n=Number(n)||0;return n.toLocaleString("ko-KR")+"원"}
function today(){const d=new Date(),p=x=>String(x).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
function safeUrl(u){u=(u||"").trim();return /^https?:\/\//.test(u)?u:""}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

const SPK='<svg viewBox="0 0 24 24" aria-hidden="true" class="spk"><path d="M12 0c.6 6.2 5.8 11.4 12 12-6.2.6-11.4 5.8-12 12-.6-6.2-5.8-11.4-12-12C6.2 11.4 11.4 6.2 12 0z"/></svg>';
function spark(x,y,s){return '<svg viewBox="0 0 24 24" aria-hidden="true" class="spark" style="left:'+x+';top:'+y+';width:'+s+'px;height:'+s+'px"><path d="M12 0c.6 6.2 5.8 11.4 12 12-6.2.6-11.4 5.8-12 12-.6-6.2-5.8-11.4-12-12C6.2 11.4 11.4 6.2 12 0z"/></svg>'}
function secTitle(t,sub){return '<h2 class="sec-title">'+SPK+'<span>'+t+'</span>'+SPK+'</h2>'+(sub?'<span class="sec-sub">'+sub+'</span>':'')}

const DEF_SITE={name:"Commission Box",intro:"내 캐릭터들과 소중한 커미션 작업물을 모아 두는 작은 보관함이에요.",nick:"",contact:"",
  profileKeys:["나이","성별","키","생일","종족 / 직업","성격","좋아하는 것","싫어하는 것"],
  greeting:"안녕하세요! 커미션 신청드립니다.",closing:"확인 부탁드립니다. 감사합니다!"};
let FB=null,db=null,auth=null,me=null,canWrite=false,phase="loading";
let SITE=Object.assign({},DEF_SITE),siteExists=null,CHARS=[],ARTISTS=[],coreLoaded={chars:false,artists:false};
let editing=false,armed=null,lightbox=null,toastTimer=null;
let filt={ch:"",st:"",ar:"",mo:today().slice(0,7),lim:PAGE};
let view=lsGet("cb-view")||"table";
let charQ="",charWorkLim=24,lastAdded=null;
const FORM_KEY="cb-form-v1";

/* ---------- Firestore adapter ---------- */
function wrapDoc(s){return {id:s.id,exists:s.exists(),data:()=>s.data(),metadata:s.metadata}}
function makeDb(fs){
  const q=(ref,cons)=>({
    where:(a,op,v)=>q(ref,cons.concat([FB.where(a,op,v)])),
    orderBy:(a,d)=>q(ref,cons.concat([FB.orderBy(a,d||"asc")])),
    limit:n=>q(ref,cons.concat([FB.limit(n)])),
    get:()=>FB.getDocs(FB.query(ref,...cons)).then(s=>({docs:s.docs.map(wrapDoc)})),
    onSnapshot:(n,e)=>FB.onSnapshot(FB.query(ref,...cons),s=>n({docs:s.docs.map(wrapDoc),metadata:s.metadata}),e)
  });
  return {
    collection:p=>q(FB.collection(fs,p),[]),
    doc:p=>{const r=FB.doc(fs,p);return {
      get:()=>FB.getDoc(r).then(wrapDoc),
      onSnapshot:(n,e)=>FB.onSnapshot(r,s=>n(wrapDoc(s)),e),
      set:(d,merge)=>merge?FB.setDoc(r,d,{merge:true}):FB.setDoc(r,d),
      updateField:(field,v)=>FB.updateDoc(r,new FB.FieldPath(...field.split(".")),v),
      update:d=>FB.updateDoc(r,d),
      delete:()=>FB.deleteDoc(r)}}
  };
}

/* ---------- subscriptions ---------- */
let subs={},needed={},rq=0;
function sched(){if(!rq)rq=setTimeout(()=>{rq=0;render(true)},16)}
function need(key,mk,single){
  needed[key]=1;let s=subs[key];
  if(!s){s=subs[key]={loading:true,docs:[],doc:null,err:null};
    try{s.unsub=mk().onSnapshot(snap=>{s.loading=false;
      if(single)s.doc=snap.exists?Object.assign({id:snap.id},snap.data()):null;
      else s.docs=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
      sched()},e=>{s.loading=false;s.err=(e&&e.code)||"unavailable";console.warn(e);sched()})}
    catch(e){s.loading=false;s.err="invalid";console.warn(e)}}
  return s;
}
function sweep(){Object.keys(subs).forEach(k=>{if(!needed[k]){try{subs[k].unsub&&subs[k].unsub()}catch(e){}delete subs[k]}})}

/* ---------- writes ---------- */
const wq={};
function run(path,fn){const p=(wq[path]||Promise.resolve()).catch(()=>{}).then(fn);wq[path]=p;p.catch(errToast);return p}
function setDoc(path,data,merge){return run(path,()=>db.doc(path).set(data,merge))}
function upd(path,data){return run(path,()=>db.doc(path).update(data))}
function updField(path,field,v){return run(path,()=>field.indexOf(".")>=0?db.doc(path).updateField(field,v):db.doc(path).update({[field]:v}))}
function delDoc(path){return run(path,()=>db.doc(path).delete())}
function errToast(e){const c=e&&e.code||"";console.warn(e);
  if(c.indexOf("permission")>=0)toast("저장 권한이 없어요. 주인 계정으로 로그인했는지 확인해 주세요.");
  else if(c.indexOf("resource-exhausted")>=0)toast("오늘 무료 사용량을 다 썼어요. 내일 다시 저장돼요.");
  else if(c.indexOf("invalid")>=0)toast("저장하지 못했어요. 이미지가 너무 큰지 확인해 주세요.");
  else toast("저장하지 못했어요. 인터넷 연결을 확인해 주세요.")}

function buildOutput(){
  const L=[],sel=F.chars.map(charById).filter(Boolean);
  if(SITE.greeting)L.push(SITE.greeting,"");
  L.push("■ 신청 항목: "+F.type.trim(),"■ 캐릭터: "+sel.map(c=>c.name).join(", "));
  if(F.due)L.push("■ 희망 마감일: "+F.due);
  if(F.budget.trim())L.push("■ 예산: "+F.budget.trim());
  sel.forEach(c=>{const b=[],p=c.p||{};
    if(F.incFields){const fl=keys().filter(k=>p[k]);if(fl.length)b.push(fl.map(k=>"- "+k+": "+p[k]).join("\n"))}
    if(F.incLook&&c.look)b.push("외형: "+c.look);
    if(F.incCaution&&c.caution)b.push("주의사항: "+c.caution);
    if((c.refLinks||"").trim())b.push("참고: "+c.refLinks.trim().split("\n").join("\n      "));
    if(b.length)L.push("","["+c.name+"]",b.join("\n"))});
  L.push("","■ 요청 사항",F.detail.trim());
  if(F.refs.trim())L.push("","■ 참고 자료",F.refs.trim());
  if(F.usage.trim())L.push("","■ 사용 범위: "+F.usage.trim());
  if(SITE.nick||SITE.contact)L.push("■ 신청자: "+[SITE.nick,SITE.contact].filter(Boolean).join(" / "));
  if(SITE.closing)L.push("",SITE.closing);
  return L.join("\n");
}

   st(3,"보낸 신청 기록하기",'신청서 아래 <b>[작업 기록에 추가]</b>. 다음 건은 <b>[다음 신청서]</b>를 누르면 요청 사항만 비워져요.')+
   st(4,"진행 상황 바꾸기",'<a href="#works">작업물</a> 표에서 상태 칸을 눌러 <b>신청 → 입금 완료 → 작업 중 → 완료</b>로 바꿔요.')+
   st(5,"완성작 보관하기",'기록을 열고 <b>[편집]</b> → <b>[+ 이미지 추가]</b>, 완료일 입력. 고화질 원본은 구글 드라이브에 두고 <b>원본 링크</b>에 주소를 적어 두면 좋아요.')+
   st(6,"자랑하기",'이 홈페이지 주소를 그대로 보내면 돼요. 누구나 로그인 없이 볼 수 있고, 가격·메모·보낸 신청서는 나만 보여요.')+
   '</div></div>';
}

/* ---------- render ---------- */
function page(){
  if(R==="chars")return pageChars();if(R==="works")return pageWorks();if(R==="artists")return pageArtists();if(R==="request")return pageRequest();if(R==="guide")return pageGuide();
  const m=R.match(/^(char|work|artist)-(.+)$/);
  if(m)return m[1]==="char"?pageChar(m[2]):m[1]==="work"?pageWork(m[2]):pageArtist(m[2]);
  return pageHome();
}
function render(keep){
  const y=window.scrollY,ae=document.activeElement;let fs=null;
  if(ae&&ae.id&&$("#app").contains(ae)&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA")&&!["file","checkbox","color"].includes(ae.type))fs={id:ae.id,v:ae.value,a:ae.selectionStart,b:ae.selectionEnd};
  needed={};
  let body;
  if(phase==="setup")body='<div class="setup"><div class="oval"><h1 style="font-size:40px">Commission Box</h1></div><p>아직 Firebase 설정이 안 들어갔어요.<br>파일 안의 <b>FIREBASE_CONFIG</b> 부분에 Firebase 콘솔에서 복사한 값을 붙여넣어 주세요.</p></div>';
  else if(phase==="error")body='<div class="setup"><h1 class="pg-title">앗</h1><p>보관함에 연결하지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</p></div>';
  else if(phase==="loading")body='<div class="setup"><p class="muted">불러오는 중…</p></div>';
  else body=header()+'<main>'+page()+'</main>'+footer();
  $("#app").innerHTML=body+(lightbox?'<div class="lightbox" data-act="lb-close" role="dialog" aria-label="이미지 크게 보기"><img src="'+esc(lightbox)+'" alt=""></div>':'');
  if(phase==="ok")sweep();
  document.title=SITE.name;
  if(keep)window.scrollTo(0,y);
  if(fs){const el=document.getElementById(fs.id);if(el){el.value=fs.v;el.focus();try{el.setSelectionRange(fs.a,fs.b)}catch(e){}}}
}
function toast(msg){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true},3400)}

/* ---------- images ---------- */
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
const fileURL=f=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(f)});
function encode(img,max,limit){
  let sc=Math.min(1,max/Math.max(img.width,img.height)),q=.85,out="";
  for(let n=0;n<12;n++){
    const w=Math.max(1,Math.round(img.width*sc)),h=Math.max(1,Math.round(img.height*sc)),cv=document.createElement("canvas");cv.width=w;cv.height=h;
    const x=cv.getContext("2d");x.drawImage(img,0,0,w,h);out=cv.toDataURL("image/webp",q);
    if(out.indexOf("data:image/webp")!==0){x.globalCompositeOperation="destination-over";x.fillStyle="#fff";x.fillRect(0,0,w,h);out=cv.toDataURL("image/jpeg",q)}
    if(out.length<=limit)return out;
    if(q>.55)q-=.1;else sc*=.8;
  }
  return out;
}
function addImages(files,colPath,onFirst){
  files=[...files];let done=0,chain=Promise.resolve();
  toast("이미지 "+files.length+"장 저장 중…");
  files.forEach((f,k)=>{chain=chain.then(()=>fileURL(f).then(loadImg).then(img=>{
    const data=encode(img,1800,300000),id=uid();
    return setDoc(colPath+"/"+id,{data,t:Date.now()+k}).then(()=>{done++;if(onFirst&&done===1)return onFirst(img)});
  }).catch(()=>{}))});
  chain.then(()=>toast(done===files.length?"이미지 "+done+"장 저장했어요.":"이미지 "+done+"/"+files.length+"장만 저장했어요."));
}

/* ---------- events ---------- */
const deb={};
function bindWrite(t,immediate){
  const d=t.dataset;let v;
  if(d.check)v=t.checked;else if(d.num)v=t.value===""?0:Number(t.value);else if(d.list)v=t.value.split(",").map(x=>x.trim()).filter(Boolean);else if(d.lines)v=t.value.split("\n").map(x=>x.trim()).filter(Boolean);else v=t.value;
  const go=()=>{if(d.merge)setDoc(d.doc,{[d.field]:v},true);else updField(d.doc,d.field,v)};
  clearTimeout(deb[t.id]);if(immediate)go();else deb[t.id]=setTimeout(go,900);
}
function ensureArtist(name){name=(name||"").trim();if(!name)return Promise.resolve(null);const a=artistByName(name);if(a)return Promise.resolve(a.id);const id=uid();return setDoc("artists/"+id,{name,link:"",contact:"",how:"",memo:"",t:Date.now()}).then(()=>id)}
document.addEventListener("input",e=>{
  const t=e.target,d=t.dataset;
  if(t.id==="char-q"){charQ=t.value;render(true);return}
  if(d.f){F[d.f]=t.type==="checkbox"?t.checked:t.value;saveForm();if(d.f==="artist"){const b=$("#how-box");if(b){const tmp=document.createElement("div");tmp.innerHTML=howBox();b.replaceWith(tmp.firstChild)}}return}
  if(d.fchar){F.chars=[...document.querySelectorAll("[data-fchar]:checked")].map(x=>x.value);saveForm();const hn=$("#ch-count");if(hn)hn.textContent=F.chars.length+"명 선택";return}
  if(d.doc&&d.field&&t.tagName!=="SELECT"&&!["checkbox","color"].includes(t.type))bindWrite(t,false);
});
document.addEventListener("change",e=>{
  const t=e.target,d=t.dataset;
  if(d.filt){filt[d.filt]=t.value;filt.lim=PAGE;render(true);return}
  if(d.doc&&d.field){bindWrite(t,true);return}
  if(d.wchars){upd("works/"+d.wchars,{chars:[...document.querySelectorAll('[data-wchars="'+d.wchars+'"]:checked')].map(x=>x.value)});return}
  if(d.artistOf){const wid=d.artistOf,nm=t.value.trim();ensureArtist(nm).then(aid=>upd("works/"+wid,{artist:nm,artistId:aid||""}));return}
  if(d.charimg&&t.files&&t.files[0]){fileURL(t.files[0]).then(loadImg).then(img=>upd("chars/"+d.charimg,{img:encode(img,700,120000)})).then(()=>toast("대표 이미지를 바꿨어요."),()=>{});return}
  if(d.refs&&t.files&&t.files.length){addImages(t.files,"chars/"+d.refs+"/refs");return}
  if(d.wimgs&&t.files&&t.files.length){const ws=subs["work:"+d.wimgs],w=ws&&ws.doc,wid=d.wimgs;
    addImages(t.files,"works/"+wid+"/imgs",w&&w.thumb?null:img=>upd("works/"+wid,{thumb:encode(img,320,30000)}));return}
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="req-form")return;e.preventDefault();
  const miss=[];if(!F.type.trim())miss.push("신청 항목");if(!F.chars.length)miss.push("캐릭터");if(!F.detail.trim())miss.push("요청 사항");
  if(miss.length){formErr=miss.join(", ")+"을(를) 채워 주세요.";output=null}else{formErr="";output=buildOutput();lastAdded=null}
  render(true);const el=$(output!=null?"#req-out":"[role=alert]");if(el)el.scrollIntoView({behavior:"smooth",block:"center"});
});
function copyText(el){const txt=el?el.value:"";const fb=()=>{if(el){el.focus();el.select()}toast("선택해 뒀어요. Ctrl+C (또는 길게 눌러 복사)로 복사해 주세요.")};try{navigator.clipboard.writeText(txt).then(()=>toast("복사했어요."),fb)}catch(err){fb()}}
function newWork(extra,priv){const id=uid();const w=Object.assign({title:"",artist:"",artistId:"",chars:[],type:"",reqDate:today(),doneDate:"",status:0,usage:"",link:"",thumb:"",t:Date.now()},extra||{});
  return setDoc("works/"+id,w).then(()=>priv?setDoc("priv/"+id,priv,true):null).then(()=>id)}
function newChar(name,order){const id=uid();return setDoc("chars/"+id,{name,sub:"",tags:[],color:"#D98A98",img:"",p:{},look:"",caution:"",refLinks:"",desc:"",order,t:Date.now()}).then(()=>id)}
const maxOrder=()=>CHARS.reduce((m,c)=>Math.max(m,+c.order||0),0);
function delCollection(path){return db.collection(path).limit(500).get().then(s=>s.docs.reduce((p,d)=>p.then(()=>db.doc(path+"/"+d.id).delete()),Promise.resolve()))}
document.addEventListener("click",e=>{
  const z=e.target.closest("[data-zoom]");if(z){lightbox=z.getAttribute("src");render(true);return}
  if(e.target.closest("select"))return;
  const pk=e.target.closest("[data-pick]");if(pk){F.chars=[pk.dataset.pick];output=null;saveForm()}
  const pa=e.target.closest("[data-pick-artist]");if(pa){F.artist=pa.dataset.pickArtist;output=null;saveForm()}
  const go=e.target.closest("[data-go]");if(go&&!e.target.closest("a")){location.hash=go.dataset.go;return}
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act;if(a!=="arm")armed=null;
  switch(a){
    case "login":FB.signInWithPopup(auth,new FB.GoogleAuthProvider()).catch(err=>{console.warn(err);toast(String(err&&err.code||"").includes("unauthorized-domain")?"이 주소가 Firebase에 등록되지 않았어요. 승인된 도메인에 추가해 주세요.":"로그인하지 못했어요.")});break;
    case "logout":FB.signOut(auth);editing=false;break;
    case "lb-close":lightbox=null;render(true);break;
    case "edit":editing=!editing;render(true);break;
    case "view":view=b.dataset.v;lsSet("cb-view",view);render(true);break;
    case "qf":filt={ch:"",st:b.dataset.st||"",ar:"",mo:b.dataset.mo?today().slice(0,7):"",lim:PAGE};break;
    case "all-months":filt.mo=filt.mo?"":today().slice(0,7);filt.lim=PAGE;render(true);break;
    case "more-works":filt.lim+=PAGE;render(true);break;
    case "more-cw":charWorkLim+=24;render(true);break;
    case "arm":{const k=b.dataset.key;if(armed!==k){armed=k;render(true);break}armed=null;
      const m=k.match(/^(char|work|artist)-(.+)$/),path=m[1]+"s/"+m[2];
      const sub=m[1]==="char"?path+"/refs":m[1]==="work"?path+"/imgs":null;
      (sub?delCollection(sub):Promise.resolve()).then(()=>m[1]==="work"?delDoc("priv/"+m[2]):null).then(()=>delDoc(path)).then(()=>toast("삭제했어요."),errToast);
      location.hash=m[1]+"s";break}
    case "bulk-add":{const ta=$("#bulk-names"),names=(ta&&ta.value||"").split("\n").map(x=>x.trim()).filter(Boolean);
      if(!names.length){toast("이름을 한 줄에 하나씩 적어 주세요.");break}
      const o=maxOrder();names.reduce((p,n,k)=>p.then(()=>newChar(n,o+k+1)),Promise.resolve()).then(()=>toast(names.length+"명 추가했어요."));ta.value="";break}
    case "add-char":newChar("새 캐릭터",maxOrder()+1).then(id=>{location.hash="char-"+id});break;
    case "mv-char":{const i=+b.dataset.i,j=i+(+b.dataset.d),A=CHARS[i],B=CHARS[j];if(!A||!B)break;
      let oa=+A.order||i,ob=+B.order||j;if(oa===ob)ob=oa+(+b.dataset.d);upd("chars/"+A.id,{order:ob});upd("chars/"+B.id,{order:oa});break}
    case "clear-charimg":upd("chars/"+b.dataset.id,{img:""});break;
    case "del-img":{const ip=b.dataset.path;delDoc(ip).then(()=>{
      const mm=ip.match(/^works\/([^/]+)\/imgs\//);if(!mm)return;const s=subs["imgs:"+mm[1]],rest=s?s.docs.filter(d=>ip!=="works/"+mm[1]+"/imgs/"+d.id):[];
      if(rest.length)return loadImg(rest[0].data).then(img=>upd("works/"+mm[1],{thumb:encode(img,320,30000)}));return upd("works/"+mm[1],{thumb:""})});break}
    case "add-work":newWork(b.dataset.char?{chars:[b.dataset.char]}:null).then(id=>{editing=true;location.hash="work-"+id});break;
    case "add-artist":{const id=uid();setDoc("artists/"+id,{name:"새 작가",link:"",contact:"",how:"",memo:"",t:Date.now()}).then(()=>{location.hash="artist-"+id});break}
    case "form-reset":F=blankForm();output=null;formErr="";lastAdded=null;lsDel(FORM_KEY);render(true);break;
    case "form-next":{F.detail="";F.refs="";F.due="";output=null;formErr="";lastAdded=null;saveForm();render(true);const dt=$("#rq-detail");if(dt)dt.focus();break}
    case "copy":copyText($("#out-text"));break;
    case "to-record":{if(lastAdded){toast("이미 기록에 추가했어요.");break}
      const txt=$("#out-text")?$("#out-text").value:output,nm=F.chars.map(charById).filter(Boolean).map(c=>c.name),an=F.artist.trim();
      b.disabled=true;
      ensureArtist(an).then(aid=>newWork({title:(nm.join("·")+" "+F.type).trim(),artist:an,artistId:aid||"",chars:F.chars.slice(),type:F.type.trim(),usage:F.usage},{reqText:txt}))
        .then(id=>{lastAdded=id;toast("작업 기록에 추가했어요.");render(true)},()=>{b.disabled=false});break}
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&lightbox){lightbox=null;render(true)}});
window.addEventListener("hashchange",()=>{R=route();lightbox=null;armed=null;render();window.scrollTo(0,0)});

/* ---------- boot ---------- */
render();
(async function(){
  if(!FIREBASE_CONFIG.projectId||/여기/.test(FIREBASE_CONFIG.apiKey)){phase="setup";render();return}
  try{
    const base="https://www.gstatic.com/firebasejs/"+V+"/";
    const [app,fs,au]=await Promise.all([import(base+"firebase-app.js"),import(base+"firebase-firestore.js"),import(base+"firebase-auth.js")]);
    FB=Object.assign({},fs,au);
    const fapp=app.initializeApp(FIREBASE_CONFIG);
    let store;try{store=fs.initializeFirestore(fapp,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})})}catch(e){store=fs.getFirestore(fapp)}
    db=makeDb(store);auth=au.getAuth(fapp);
    phase="ok";
    db.doc("site/main").onSnapshot(s=>{siteExists=s.exists;SITE=Object.assign({},DEF_SITE,s.exists?s.data():{});
      if(!s.exists&&canWrite&&!s.metadata.fromCache)setDoc("site/main",DEF_SITE,true);sched()},e=>console.warn(e));
    db.collection("chars").orderBy("order","asc").limit(300).onSnapshot(s=>{CHARS=s.docs.map(d=>Object.assign({id:d.id},d.data()));coreLoaded.chars=true;sched()},e=>{console.warn(e);coreLoaded.chars=true;sched()});
    db.collection("artists").orderBy("name","asc").limit(500).onSnapshot(s=>{ARTISTS=s.docs.map(d=>Object.assign({id:d.id},d.data()));coreLoaded.artists=true;sched()},e=>{console.warn(e);coreLoaded.artists=true;sched()});
    au.onAuthStateChanged(auth,u=>{me=u;canWrite=!!(u&&u.email&&u.email.toLowerCase()===OWNER_EMAIL.toLowerCase());if(!canWrite)editing=false;
      if(canWrite&&siteExists===false)setDoc("site/main",DEF_SITE,true);
      Object.keys(subs).forEach(k=>{if(k.indexOf("priv:")===0){try{subs[k].unsub()}catch(e){}delete subs[k]}});render(true)});
    render();
  }catch(e){console.error(e);phase="error";render()}
})();
</script>
